spring.datasource.admin.username=${DB_ADMIN_USERNAME}
spring.datasource.admin.password=${DB_ADMIN_PASSWORD}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD}

# H2 console is exposed so database-inspection challenges stay solvable in the public deployment.
# Challenges only publish read-only users scoped to their own table (e.g. cryptographic_failures_user
# has SELECT on cryptographic_failures_vault only); admin and application credentials stay secret.
# web-allow-others is required because requests arrive through the facade container.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
vulnerableapp.email.base-url=${APP_BASE_URL}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
