<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnerableApp - Login</title>
    <link href="fake-login.css" rel="stylesheet"/>
</head>
<body>
<nav>Fake Social Media</nav>

<div class="page">
    <div class="auth-shell">
        <h3 class="auth-title">Fake Social Media</h3>
        <p class="auth-subtitle">Your session has expired. Please log in again.</p>

        <div class="auth-card">
            <h5>Login</h5>
            <div class="auth-row">
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input autocomplete="username" id="username" placeholder="Enter username" type="text"/>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input autocomplete="current-password" id="password" placeholder="Enter password" type="password"/>
                </div>
                <button id="loginBtn" onclick="harvest()">Login</button>
            </div>
            <div id="errorMsg">Invalid username or password. Please try again.</div>
        </div>
    </div>
</div>

<script src="fake-login.js"></script>
</body>
</html>
