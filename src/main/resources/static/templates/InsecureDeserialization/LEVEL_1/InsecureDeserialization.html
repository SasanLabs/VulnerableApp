<div id="InsecureDeserialization">
	<div>
		<div>
			<div id="challenge"></div>

			<div id="level1Controls" class="hide-component">
				<label for="theme">Theme:</label>
				<select id="theme" name="theme">
					<option value="light">light</option>
					<option value="dark">dark</option>
				</select>
				<label for="notificationsEnabled">
					<input type="checkbox" id="notificationsEnabled" name="notificationsEnabled"/>
					Enable notifications
				</label>
				<button id="saveButtonLevel1">Save preferences</button>
			</div>

			<div id="level2Controls" class="hide-component">
				<label for="section">Section:</label>

					<option value="Level 1">Level 1</option>
					<option value="Level 2">Level 2</option>
					<option value="Level 3">Level 3</option>
				</select>
				<button id="saveButtonLevel2">Visit section</button>
			</div>

			<div id="level34Controls" class="hide-component">
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" placeholder="your name"/>
				<button id="saveButtonLevel34">Log in</button>
			</div>

			<button id="checkButton">Check now</button>
			<div id="result"></div>
		</div>
	</div>
</div>
