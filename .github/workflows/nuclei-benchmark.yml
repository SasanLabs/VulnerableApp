name: Nuclei Benchmark

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuclei-benchmark:
    name: Nuclei Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout repo
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------------
      # 2. Start VulnerableApp
      # ------------------------------------------------------------------
      - name: Start VulnerableApp
        run: |
          docker compose -f docker-compose.without_llm.yml up -d

      # ------------------------------------------------------------------
      # 3. Wait for app to be ready
      # ------------------------------------------------------------------
      - name: Wait for VulnerableApp
        run: |
          echo "Waiting for VulnerableApp..."
          for i in {1..40}; do
            if curl -sf http://localhost/VulnerableApp/scanner/dast >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 10
          done
          echo "App failed to start"
          docker compose -f docker-compose.without_llm.yml logs
          exit 1

      # ------------------------------------------------------------------
      # 4. Build the target list and run Nuclei (default + DAST templates)
      # ------------------------------------------------------------------
      - name: Run Nuclei scan
        run: |
          mkdir -p benchmarks/Nuclei/.scan
          rm -f benchmarks/Nuclei/.scan/urls.txt \
                benchmarks/Nuclei/.scan/nuclei-default.jsonl \
                benchmarks/Nuclei/.scan/nuclei-dast.jsonl \
                benchmarks/Nuclei/.scan/nuclei-raw.jsonl \
                benchmarks/Nuclei/.scan/nuclei-default.log \
                benchmarks/Nuclei/.scan/nuclei-scan.log

          echo "=== build target list from /scanner/dast ==="
          curl -s http://localhost/VulnerableApp/scanner/dast \
            | python3 benchmarks/Nuclei/scripts/build_url_list.py \
                --base-url http://localhost \
                -o benchmarks/Nuclei/.scan/urls.txt
          echo "targets: $(wc -l < benchmarks/Nuclei/.scan/urls.txt 2>/dev/null || echo 0)"
          head -5 benchmarks/Nuclei/.scan/urls.txt

          echo "=== nuclei: misconfiguration/tech templates ==="
          docker run --rm \
            --network host \
            -v "$(pwd)/benchmarks/Nuclei:/nuclei-out:rw" \
            projectdiscovery/nuclei:latest \
            -l /nuclei-out/.scan/urls.txt -tags misconfig,tech -c 50 -timeout 5 -retries 1 -silent -ni -jsonl \
            -o /nuclei-out/.scan/nuclei-default.jsonl \
            2> benchmarks/Nuclei/.scan/nuclei-default.log
          echo "default-templates exit=$?"

          echo "=== nuclei: DAST fuzzing templates ==="
          docker run --rm \
            --network host \
            -v "$(pwd)/benchmarks/Nuclei:/nuclei-out:rw" \
            projectdiscovery/nuclei:latest \
            -l /nuclei-out/.scan/urls.txt -dast -c 50 -timeout 5 -retries 1 -stats -ni -jsonl \
            -o /nuclei-out/.scan/nuclei-dast.jsonl \
            2> benchmarks/Nuclei/.scan/nuclei-scan.log
          echo "dast exit=$?"

          # Merge the two runs; ignore whichever produced no findings.
          : > benchmarks/Nuclei/.scan/nuclei-raw.jsonl
          [ -s benchmarks/Nuclei/.scan/nuclei-default.jsonl ] \
            && cat benchmarks/Nuclei/.scan/nuclei-default.jsonl >> benchmarks/Nuclei/.scan/nuclei-raw.jsonl
          [ -s benchmarks/Nuclei/.scan/nuclei-dast.jsonl ] \
            && cat benchmarks/Nuclei/.scan/nuclei-dast.jsonl >> benchmarks/Nuclei/.scan/nuclei-raw.jsonl
          echo "raw findings: $(wc -l < benchmarks/Nuclei/.scan/nuclei-raw.jsonl)"

      # ------------------------------------------------------------------
      # 6. Verify report
      # ------------------------------------------------------------------
      - name: Verify Nuclei report
        run: |
          REPORT=benchmarks/Nuclei/.scan/nuclei-raw.jsonl
          if [ ! -s "$REPORT" ]; then
            echo "::error::no Nuclei report produced"
            echo "--- urls.txt head ---"
            head -20 benchmarks/Nuclei/.scan/urls.txt 2>/dev/null | sed 's/^/::error::URL /'
            echo "--- default templates log tail ---"
            tail -40 benchmarks/Nuclei/.scan/nuclei-default.log 2>/dev/null | sed 's/^/::error::DEF /'
            echo "--- dast log tail ---"
            tail -60 benchmarks/Nuclei/.scan/nuclei-scan.log 2>/dev/null | sed 's/^/::error::NUC /'
            exit 1
          fi

          ls -lh "$REPORT"
          COUNT=$(wc -l < "$REPORT")
          echo "Finding count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: zero findings. Refusing to submit an empty scan; check templates, target and network." >&2
            exit 1
          fi

      # ------------------------------------------------------------------
      # 7. Convert Nuclei report to benchmark input format
      # ------------------------------------------------------------------
      - name: Convert Nuclei report
        run: |
          python3 benchmarks/Nuclei/scripts/convert_nuclei_to_benchmark.py \
            --input  benchmarks/Nuclei/.scan/nuclei-raw.jsonl \
            --output benchmarks/Nuclei/nuclei-benchmark-input.json

      # ------------------------------------------------------------------
      # 8. Submit to benchmark endpoint and save results
      # ------------------------------------------------------------------
      - name: Run benchmark
        run: |
          curl -sS --fail-with-body -X POST http://localhost/VulnerableApp/scanner/benchmark \
            -H "Content-Type: application/json" \
            -d @benchmarks/Nuclei/nuclei-benchmark-input.json \
            -o benchmarks/Nuclei/nuclei-results.json

          echo "=== Nuclei Benchmark Results ==="
          python3 -c "
          import json
          with open('benchmarks/Nuclei/nuclei-results.json') as f:
              data = json.load(f)
          print(f'  Tool:          {data[\"tool\"]}')
          print(f'  Coverage:  {data[\"coverage\"]:.2f}%')
          print(f'  Total Expected:{data[\"totalExpected\"]}')
          print(f'  Detected:  {data[\"detected\"]}')
          print(f'  Missed:    {data[\"missed\"]}')
          print(f'  Unmatched: {data[\"unmatched\"]}')
          "

      # ------------------------------------------------------------------
      # 9. Commit and push results back to repo (master only)
      # ------------------------------------------------------------------
      - name: Commit benchmark results
        env:
          TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          if [ -z "$TOKEN" ]; then
            echo "GH_TRAFFIC_TOKEN not configured; skipping remote git push."
            exit 0
          fi

          if [ "$REF_NAME" != "master" ]; then
            echo "Running on non-master branch '$REF_NAME'; skipping automatic push to master."
            exit 0
          fi

          git config user.name "preetkaran20"
          git config user.email "preetkaran20@gmail.com"
          git add benchmarks/Nuclei/nuclei-results.json benchmarks/Nuclei/nuclei-benchmark-input.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update Nuclei benchmark results [$(date -u '+%Y-%m-%d')]"
          success=false

          for i in {1..5}; do
            echo "Push attempt $i..."
            if git pull --rebase origin master && git push "https://preetkaran20:${TOKEN}@github.com/SasanLabs/VulnerableApp.git" HEAD:master; then
              success=true
              break
            fi

            git rebase --abort 2>/dev/null || true
            echo "Push failed. Retrying in 10 seconds..."
            sleep 10
          done

          if [ "$success" != "true" ]; then
            echo "Failed to push after 5 attempts."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 10. Upload raw report and input as artifacts
      # ------------------------------------------------------------------
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-benchmark-artifacts
          path: |
            benchmarks/Nuclei/.scan/nuclei-raw.jsonl
            benchmarks/Nuclei/.scan/nuclei-default.jsonl
            benchmarks/Nuclei/.scan/nuclei-dast.jsonl
            benchmarks/Nuclei/.scan/urls.txt
            benchmarks/Nuclei/.scan/nuclei-default.log
            benchmarks/Nuclei/.scan/nuclei-scan.log
            benchmarks/Nuclei/nuclei-benchmark-input.json
            benchmarks/Nuclei/nuclei-results.json
          retention-days: 90
