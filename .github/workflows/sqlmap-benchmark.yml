name: sqlmap Benchmark

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/sqlmap/**'
      - '.github/workflows/sqlmap-benchmark.yml'

permissions:
  contents: read

jobs:
  report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test native-report conversion and sitemap input
        run: python3 -m unittest discover -s benchmarks/sqlmap/scripts -v

      - name: Verify pipeline exit status with a dummy process
        shell: bash
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT

          status=0
          (printf 'dummy failure\n'; exit 7) | tee "$log" || status=$?
          test "$status" -eq 7
          test "$(cat "$log")" = 'dummy failure'

          printf 'dummy success\n' | tee "$log"
          test "$(cat "$log")" = 'dummy success'

  sqlmap-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: report-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve newest sqlmap release tag
        id: sqlmap
        run: |
          # Version-numbered tags only, so untagged master and old -rc tags are never used.
          tag="$(git ls-remote --tags --refs https://github.com/sqlmapproject/sqlmap.git \
            | sed 's#.*refs/tags/##' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout sqlmap ${{ steps.sqlmap.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: sqlmapproject/sqlmap
          ref: refs/tags/${{ steps.sqlmap.outputs.tag }}
          path: .tools/sqlmap
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start modern UI Docker stack
        run: |
          mkdir -p benchmarks/sqlmap/artifacts-metadata
          git rev-parse HEAD > benchmarks/sqlmap/artifacts-metadata/workflow-revision.txt
          git -C .tools/sqlmap rev-parse HEAD > benchmarks/sqlmap/artifacts-metadata/sqlmap-revision.txt
          docker compose -f docker-compose.without_llm.yml up -d
          docker image inspect sasanlabs/owasp-vulnerableapp:latest \
            sasanlabs/owasp-vulnerableapp-facade:latest \
            sasanlabs/owasp-vulnerableapp-jsp:latest sasanlabs/owasp-vulnerableapp-php:latest \
            --format '{{.Id}} {{json .RepoDigests}}' \
            > benchmarks/sqlmap/artifacts-metadata/images.txt
          for attempt in {1..40}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1/VulnerableApp/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Facade stack did not become ready'
          exit 1

      - name: Prepare sitemap input
        run: |
          mkdir -p benchmarks/sqlmap/artifacts
          curl --fail --show-error --silent --max-time 30 http://127.0.0.1/sitemap.xml \
            -o benchmarks/sqlmap/artifacts/sitemap.xml
          python3 benchmarks/sqlmap/scripts/sitemap_to_targets.py \
            --sitemap benchmarks/sqlmap/artifacts/sitemap.xml \
            --base-url http://127.0.0.1 \
            --output benchmarks/sqlmap/artifacts/targets.txt

      - name: Run sqlmap CLI
        shell: bash
        env:
          SQLMAP_TAG: ${{ steps.sqlmap.outputs.tag }}
        run: |
          test "$(python3 .tools/sqlmap/sqlmap.py --version)" = "$SQLMAP_TAG#stable"
          python3 .tools/sqlmap/sqlmap.py --version > benchmarks/sqlmap/artifacts/sqlmap-version.txt
          ulimit -v 2097152
          set -x
          timeout --signal=TERM --kill-after=10s 20m \
            python3 .tools/sqlmap/sqlmap.py \
            -m benchmarks/sqlmap/artifacts/targets.txt \
            --scope='/VulnerableApp/(BlindSQLInjectionVulnerability|ErrorBasedSQLInjectionVulnerability|UnionBasedSQLInjectionVulnerability)/LEVEL_[0-9]+' \
            -p id --batch --answers='skip further tests=N' \
            --disable-coloring --technique=BEU --level=1 --risk=1 \
            --threads=1 --timeout=5 --retries=0 --flush-session \
            --report-json=benchmarks/sqlmap/artifacts/report.json \
            --output-dir=benchmarks/sqlmap/artifacts/session \
            2>&1 | tee benchmarks/sqlmap/artifacts/scan.log

      - name: Convert confirmed injections
        run: |
          python3 benchmarks/sqlmap/scripts/convert_sqlmap_to_benchmark.py \
            --input benchmarks/sqlmap/artifacts/report.json \
            --output benchmarks/sqlmap/artifacts/sqlmap-findings.json

      - name: Submit to benchmark
        run: |
          curl --fail-with-body --show-error --silent --max-time 60 \
            http://127.0.0.1/VulnerableApp/scanner/benchmark \
            -H 'Content-Type: application/json' \
            --data-binary @benchmarks/sqlmap/artifacts/sqlmap-findings.json \
            -o benchmarks/sqlmap/artifacts/sqlmap-results.json
          curl --fail --show-error --silent --max-time 30 \
            http://127.0.0.1/VulnerableApp/scanner/dast \
            -o benchmarks/sqlmap/artifacts/ground-truth.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('benchmarks/sqlmap/artifacts/sqlmap-results.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## sqlmap: Java SQL-injection scope\n')
              summary.write('Targets come from the facade sitemap, using GET id=1 and BEU techniques.\n\n')
              summary.write(f"Detected: {result['detected']}; whole-benchmark coverage: {result['coverage']:.2f}%.\n\n")
              summary.write('Coverage denominator includes all Java DAST vulnerabilities, not just SQL injection.\n')
              summary.write('Unmatched findings require review; they are not automatically false positives.\n')
          PY

      - name: Collect stack logs and stop containers
        if: always()
        run: |
          docker compose -f docker-compose.without_llm.yml logs --no-color \
            > benchmarks/sqlmap/artifacts-metadata/stack.log
          docker compose -f docker-compose.without_llm.yml down -v --remove-orphans

      - name: Upload reports and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-benchmark-${{ github.run_id }}
          path: |
            benchmarks/sqlmap/artifacts/
            benchmarks/sqlmap/artifacts-metadata/
          retention-days: 30
