name: sqlmap Benchmark

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/sqlmap/**'
      - '.github/workflows/sqlmap-benchmark.yml'

permissions:
  contents: read

jobs:
  sqlmap-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout sqlmap 1.10.10
        uses: actions/checkout@v4
        with:
          repository: sqlmapproject/sqlmap
          ref: 65b6e7b4acb13a736614a1ab73b0908476f3c24a
          path: .tools/sqlmap
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test converter and target discovery
        run: python3 -m unittest discover -s benchmarks/sqlmap/scripts -v

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build deployed application
        run: ./gradlew bootJar

      - name: Start isolated Java lab
        run: |
          mkdir -p benchmarks/sqlmap/artifacts-metadata
          git rev-parse HEAD > benchmarks/sqlmap/artifacts-metadata/application-revision.txt
          git -C .tools/sqlmap rev-parse HEAD > benchmarks/sqlmap/artifacts-metadata/sqlmap-revision.txt
          java -version 2> benchmarks/sqlmap/artifacts-metadata/java-version.txt
          sha256sum build/libs/VulnerableApp-1.0.0.jar > benchmarks/sqlmap/artifacts-metadata/application-jar.sha256
          java -Xmx768m -jar build/libs/VulnerableApp-1.0.0.jar \
            --server.port=9090 \
            --benchmark.output.dir=benchmarks/sqlmap/artifacts-metadata/results \
            > benchmarks/sqlmap/artifacts-metadata/application.log 2>&1 &
          echo $! > benchmarks/sqlmap/artifacts-metadata/application.pid
          for attempt in {1..40}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9090/VulnerableApp/scanner/dast > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Java lab did not become ready'
          exit 1

      - name: Scan SQL ground-truth endpoints
        run: |
          # Limit scanner address space to 2 GiB; each target also has a process deadline.
          ulimit -v 2097152
          python3 benchmarks/sqlmap/scripts/run_sqlmap.py \
            --base-url http://127.0.0.1:9090/VulnerableApp \
            --sqlmap-dir .tools/sqlmap \
            --output-dir benchmarks/sqlmap/artifacts \
            --target-timeout 120

      - name: Convert confirmed injections
        run: |
          python3 benchmarks/sqlmap/scripts/convert_sqlmap_to_benchmark.py \
            --input benchmarks/sqlmap/artifacts/runs.json \
            --output benchmarks/sqlmap/artifacts/sqlmap-findings.json

      - name: Submit to benchmark
        run: |
          curl --fail-with-body --show-error --silent --max-time 60 \
            http://127.0.0.1:9090/VulnerableApp/scanner/benchmark \
            -H 'Content-Type: application/json' \
            --data-binary @benchmarks/sqlmap/artifacts/sqlmap-findings.json \
            -o benchmarks/sqlmap/artifacts/sqlmap-results.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('benchmarks/sqlmap/artifacts/sqlmap-results.json').read_text())
          targets = json.loads(Path('benchmarks/sqlmap/artifacts/targets.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## sqlmap: Java SQL-injection scope\n')
              summary.write(f"Scanned {len(targets)} metadata endpoints using GET id=1 and BEU techniques.\n\n")
              summary.write(f"Detected: {result['detected']}; whole-benchmark coverage: {result['coverage']:.2f}%.\n\n")
              summary.write('Coverage denominator includes all Java DAST vulnerabilities, not just SQL injection.\n')
              summary.write('Unmatched findings require review; they are not automatically false positives.\n')
          PY

      - name: Stop Java lab
        if: always()
        run: |
          if [ -f benchmarks/sqlmap/artifacts-metadata/application.pid ]; then
            kill "$(cat benchmarks/sqlmap/artifacts-metadata/application.pid)" || true
          fi

      - name: Upload reports and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-benchmark-${{ github.run_id }}
          path: |
            benchmarks/sqlmap/artifacts/
            benchmarks/sqlmap/artifacts-metadata/
          retention-days: 30
