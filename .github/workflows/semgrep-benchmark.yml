name: Semgrep Benchmark

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semgrep-benchmark:
    name: Semgrep Benchmark
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ------------------------------------------------------------------
      # 1. Checkout repo
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TRAFFIC_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------------
      # 2. Start VulnerableApp from this checkout, so the ground truth it
      #    serves matches the sources that are scanned
      # ------------------------------------------------------------------
      - name: Start VulnerableApp
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun > vulnerableapp.log 2>&1 &

      # ------------------------------------------------------------------
      # 3. Run Semgrep while the app builds
      # ------------------------------------------------------------------
      - name: Run Semgrep scan
        run: |
          python -m pip install --quiet semgrep
          semgrep --version
          semgrep scan --config p/default --metrics=off --timeout 30 --json \
            --output benchmarks/Semgrep/semgrep-raw-report.json src/main/java

      # ------------------------------------------------------------------
      # 4. Convert Semgrep report to benchmark input format
      # ------------------------------------------------------------------
      - name: Convert Semgrep report
        run: |
          python benchmarks/Semgrep/scripts/convert_semgrep_to_benchmark.py \
            --input  benchmarks/Semgrep/semgrep-raw-report.json \
            --output benchmarks/Semgrep/findings/semgrep-findings.json

      # ------------------------------------------------------------------
      # 5. Wait for app to be ready
      # ------------------------------------------------------------------
      - name: Wait for VulnerableApp
        run: |
          echo "Waiting for VulnerableApp..."
          for _ in {1..60}; do
            if curl -sf http://localhost:9090/VulnerableApp/scanner >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 10
          done
          echo "App failed to start"
          cat vulnerableapp.log
          exit 1

      # ------------------------------------------------------------------
      # 6. Submit to benchmark endpoint and save results
      # ------------------------------------------------------------------
      - name: Run benchmark
        run: |
          curl -sS --fail-with-body -X POST http://localhost:9090/VulnerableApp/scanner/benchmark \
            -H "Content-Type: application/json" \
            -d @benchmarks/Semgrep/findings/semgrep-findings.json \
            -o benchmarks/Semgrep/semgrep-results.json

          echo "=== Semgrep Benchmark Results ==="
          python -c "
          import json
          with open('benchmarks/Semgrep/semgrep-results.json') as f:
              data = json.load(f)
          print(f'  Tool:          {data[\"tool\"]}')
          print(f'  Coverage:  {data[\"coverage\"]:.2f}%')
          print(f'  Total Expected:{data[\"totalExpected\"]}')
          print(f'  Detected:  {data[\"detected\"]}')
          print(f'  Missed:    {data[\"missed\"]}')
          print(f'  Unmatched: {data[\"unmatched\"]}')
          "

      # ------------------------------------------------------------------
      # 7. Commit and push results back to repo (master only)
      # ------------------------------------------------------------------
      - name: Commit benchmark results
        if: github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: |
          set -e

          git config user.name "preetkaran20"
          git config user.email "preetkaran20@gmail.com"
          git add benchmarks/Semgrep/semgrep-results.json benchmarks/Semgrep/findings/semgrep-findings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update Semgrep benchmark results [$(date -u '+%Y-%m-%d')]"
          success=false

          for i in {1..5}; do
            echo "Push attempt $i..."
            if git pull --rebase origin master && git push "https://preetkaran20:${TOKEN}@github.com/SasanLabs/VulnerableApp.git" HEAD:master; then
              success=true
              break
            fi

            git rebase --abort 2>/dev/null || true
            echo "Push failed. Retrying in 10 seconds..."
            sleep 10
          done

          if [ "$success" != "true" ]; then
            echo "Failed to push after 5 attempts."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 8. Upload raw report, findings, results and app log as artifacts
      # ------------------------------------------------------------------
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-benchmark-artifacts
          path: |
            benchmarks/Semgrep/semgrep-raw-report.json
            benchmarks/Semgrep/findings/semgrep-findings.json
            benchmarks/Semgrep/semgrep-results.json
            vulnerableapp.log
          retention-days: 90
