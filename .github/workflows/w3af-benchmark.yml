name: w3af Benchmark

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w3af-benchmark:
    name: w3af Benchmark
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout repo
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TRAFFIC_TOKEN }}
          persist-credentials: false

      # ------------------------------------------------------------------
      # 2. Start VulnerableApp
      # ------------------------------------------------------------------
      - name: Start VulnerableApp
        run: |
          docker compose -f docker-compose.without_llm.yml up -d

      # ------------------------------------------------------------------
      # 3. Wait for app to be ready
      # ------------------------------------------------------------------
      - name: Wait for VulnerableApp
        run: |
          echo "Waiting for VulnerableApp..."
          for i in {1..40}; do
            if curl -sf http://localhost/VulnerableApp/scanner/dast >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 10
          done
          echo "App failed to start"
          docker compose -f docker-compose.without_llm.yml logs
          exit 1

      # ------------------------------------------------------------------
      # 4. Resolve Docker Network
      # ------------------------------------------------------------------
      - name: Resolve Docker Network
        run: |
          CONTAINER_ID=$(docker compose -f docker-compose.without_llm.yml ps -q | head -1)
          NETWORK=$(docker inspect "$CONTAINER_ID" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          echo "NETWORK=$NETWORK" >> $GITHUB_ENV
          echo "Using network: $NETWORK"

      # ------------------------------------------------------------------
      # 5. Run w3af scan
      # ------------------------------------------------------------------
      - name: Run w3af scan
        run: |
          # Fail loudly instead of silently reusing the checked-in sample.
          mkdir -p benchmarks/w3af/.scan
          rm -f benchmarks/w3af/.scan/w3af-raw.json
          cat > benchmarks/w3af/.scan/w3af-script.w3af << 'EOF'
          plugins
          discovery web_spider
          audit xss,sqli,lfi,os_commanding,ssrf
          output json_file
          output config json_file
          set output_file /w3af-out/w3af-raw.json
          back
          back
          target
          set target http://VulnerableApp-facade/
          back
          start
          EOF

          docker run --rm \
            --network "$NETWORK" \
            -v "$(pwd)/benchmarks/w3af/.scan:/w3af-out:rw" \
            andresriancho/w3af \
            ./w3af_console --no-update -s /w3af-out/w3af-script.w3af

      # ------------------------------------------------------------------
      # 6. Verify report
      # ------------------------------------------------------------------
      - name: Verify w3af report
        run: |
          REPORT=benchmarks/w3af/.scan/w3af-raw.json
          if [ ! -s "$REPORT" ]; then
            echo "ERROR: this run produced no w3af report." >&2
            exit 1
          fi
          ls -lh "$REPORT"
          python3 - "$REPORT" << 'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          items = data.get('items') or []
          print(f'w3af findings: {len(items)}')
          if not items:
              sys.exit('ERROR: zero findings. Refusing to publish an empty scan; check plugins, target and network.')
          PY

      # ------------------------------------------------------------------
      # 7. Convert w3af report to benchmark input format
      # ------------------------------------------------------------------
      - name: Convert w3af report
        run: |
          python3 benchmarks/w3af/scripts/convert_w3af_to_benchmark.py \
            --input  benchmarks/w3af/.scan/w3af-raw.json \
            --output benchmarks/w3af/w3af-benchmark-input.json

      # ------------------------------------------------------------------
      # 8. Submit to benchmark endpoint and save results
      # ------------------------------------------------------------------
      - name: Run benchmark
        run: |
          curl -sS --fail-with-body -X POST http://localhost/VulnerableApp/scanner/benchmark \
            -H "Content-Type: application/json" \
            -d @benchmarks/w3af/w3af-benchmark-input.json \
            -o benchmarks/w3af/w3af-results.json

          echo "=== w3af Benchmark Results ==="
          python3 -c "
          import json
          with open('benchmarks/w3af/w3af-results.json') as f:
              data = json.load(f)
          print(f'  Tool:          {data[\"tool\"]}')
          print(f'  Coverage:  {data[\"coverage\"]:.2f}%')
          print(f'  Total Expected:{data[\"totalExpected\"]}')
          print(f'  Detected:  {data[\"detected\"]}')
          print(f'  Missed:    {data[\"missed\"]}')
          print(f'  Unmatched: {data[\"unmatched\"]}')
          "

      # ------------------------------------------------------------------
      # 9. Commit and push results back to repo (master only)
      # ------------------------------------------------------------------
      - name: Commit benchmark results
        if: github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: |
          set -e

          git config user.name "preetkaran20"
          git config user.email "preetkaran20@gmail.com"
          git add benchmarks/w3af/w3af-results.json benchmarks/w3af/w3af-benchmark-input.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update w3af benchmark results [$(date -u '+%Y-%m-%d')]"
          success=false

          for i in {1..5}; do
            echo "Push attempt $i..."
            if git pull --rebase origin master && git push "https://preetkaran20:${TOKEN}@github.com/SasanLabs/VulnerableApp.git" HEAD:master; then
              success=true
              break
            fi

            git rebase --abort 2>/dev/null || true
            echo "Push failed. Retrying in 10 seconds..."
            sleep 10
          done

          if [ "$success" != "true" ]; then
            echo "Failed to push after 5 attempts."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 10. Upload raw report and input as artifacts
      # ------------------------------------------------------------------
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3af-benchmark-artifacts
          path: |
            benchmarks/w3af/.scan/w3af-raw.json
            benchmarks/w3af/w3af-benchmark-input.json
            benchmarks/w3af/w3af-results.json
          retention-days: 90
