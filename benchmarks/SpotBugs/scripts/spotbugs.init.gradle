initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:latest.release'
    }
}

import com.github.spotbugs.snom.SpotBugsPlugin
import com.github.spotbugs.snom.SpotBugsTask
import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

allprojects {
    // Ensure commons-lang3 compatible with latest BCEL (6.13.0+) is used instead of Spring Boot BOM downgrade
    ext['commons-lang3.version'] = 'latest.release'
    apply plugin: SpotBugsPlugin

    dependencies {
        spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:latest.release'
    }

    spotbugs {
        toolVersion = 'latest.release'
        ignoreFailures = true
        effort.set(Effort.valueOf('MAX'))
        reportLevel.set(Confidence.valueOf('LOW'))
    }

    tasks.withType(SpotBugsTask).configureEach {
        reports {
            xml {
                required = true
                outputLocation = file("${rootDir}/benchmarks/SpotBugs/spotbugs-raw-report.xml")
            }
            html.required = false
        }
        doLast {
            def spotbugsVer = project.configurations.spotbugs.resolvedConfiguration.resolvedArtifacts.find { it.name == 'spotbugs' }?.moduleVersion?.id?.version
            def fsbVer = project.configurations.spotbugsPlugins.resolvedConfiguration.resolvedArtifacts.find { it.name == 'findsecbugs-plugin' }?.moduleVersion?.id?.version
            println "=== Resolved Scanner Versions ==="
            println "  SpotBugs:    ${spotbugsVer ?: 'unknown'}"
            println "  FindSecBugs: ${fsbVer ?: 'unknown'}"
        }
    }
}
